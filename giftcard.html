<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check your gift card — CLUTCH</title><link rel="stylesheet" href="assets/style.css"></head>
<body style="background:#0b0b0b"><header class="nav"><a class="logo" href="/">CLUTCH</a><nav><a href="/">Home</a><a href="/checkout.html">Checkout</a><a href="/drop002.html">Drop 002</a></nav></header>
<main style="max-width:700px;margin:2rem auto;padding:0 1rem">
<p class="eyebrow">Drop 01</p><h2>Check your gift card.</h2>
<p class="lede">Type in your GIFT code and we'll tell you if it's still good — $25 off at checkout.</p>
<form id="gc-form" novalidate>
<input id="gc-code" type="text" placeholder="GIFT-XXXX" required style="padding:.6rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-transform:uppercase">
<button class="btn buy live" type="submit">Check it</button>
</form>
<p id="gc-msg" class="msg" role="status"></p>
<div id="gc-result" class="fine"></div>
<p class="fine">A good card takes $25 off at <a href="/checkout.html">checkout</a> — paste the code in the discount box there. Something wrong? DM <a href="https://www.instagram.com/clutchny1/" target="_blank" rel="noopener">@clutchny1</a> with your code and we'll check it.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient('https://fgnuaxhujvxkfzzcvdqf.supabase.co', 'sb_publishable_ZFbaHvFSBXH1EsMlUe6-2A_r18hQGYz');
async function checkCode(code) {
  const msg = document.getElementById('gc-msg'), out = document.getElementById('gc-result');
  msg.textContent = ''; out.textContent = '';
  code = (code || '').trim().toUpperCase();
  if (!/^GIFT-[A-Z0-9]{4}$/.test(code)) { msg.className = 'msg err'; msg.textContent = "That doesn't look like a gift card code — it should be GIFT- followed by 4 letters or numbers."; return; }
  msg.className = 'msg'; msg.textContent = 'Checking…';
  try {
    // already redeemed? (the code lands in the order note at checkout)
    const o = await sb.from('clutch_orders').select('note').ilike('note', '%' + code + '%').limit(5);
    if (o.data && o.data.length) { msg.className = 'msg err'; msg.textContent = '❌ This gift card was already used.'; return; }
    // was it ever issued?
    const g = await sb.from('clutch_giftcards').select('code,value').eq('code', code).maybeSingle();
    if (g.error) { msg.className = 'msg'; msg.textContent = '⚠️ Couldn\'t verify this code yet — DM @clutchny1 with the code and we\'ll check it for you.'; return; }
    if (!g.data) { msg.className = 'msg err'; msg.textContent = '❌ We don\'t have a gift card with that code. Double-check it or DM @clutchny1.'; return; }
    msg.className = 'msg ok'; msg.textContent = '✅ Good to go — $' + (g.data.value || 25) + ' off at checkout.';
    out.innerHTML = 'Use it at <a href="/checkout.html?code=' + code + '">checkout</a> — the code is already filled in for you.';
  } catch (_) { msg.className = 'msg'; msg.textContent = '⚠️ Couldn\'t reach the checker right now — DM @clutchny1 with the code and we\'ll check it for you.'; }
}
document.getElementById('gc-form').addEventListener('submit', e => { e.preventDefault(); checkCode(document.getElementById('gc-code').value); });
// shareable link: /giftcard.html?code=GIFT-XXXX checks it straight away
(function () { const c = new URLSearchParams(location.search).get('code'); if (c) { document.getElementById('gc-code').value = c.trim().toUpperCase(); checkCode(c); } })();
</script>
</body></html>
